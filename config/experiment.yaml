# Authoritative configuration for the one-shot A100 experiment.
# See SPEC.md. Every accuracy arm uses the frozen 1,500-question manifest once.

model_id: Qwen/Qwen2.5-3B-Instruct

models:
  small: Qwen/Qwen2.5-1.5B-Instruct
  tiny: Qwen/Qwen2.5-0.5B-Instruct

# Resolve model and tokenizer files at these immutable Hugging Face revisions.
# The runner must record the resolved revision in every run metadata file.
model_revisions:
  Qwen/Qwen2.5-3B-Instruct: aa8e72537993ba99e69dfaafa59ed015b17504d1
  Qwen/Qwen2.5-1.5B-Instruct: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
  Qwen/Qwen2.5-0.5B-Instruct: 7ae557604adf67be50417f59c2c2f167def9a775

dataset:
  name: hotpotqa/hotpot_qa
  config: distractor
  split: validation
  revision: 1908d6afbbead072334abe2965f91bd2709910ab
  n: 1500
  eval_seed: 20260805

  # This file, rather than a fresh random draw, is authoritative. It contains
  # exactly 1,500 ordered IDs and the exact 3,031-ID exclusion union. The old
  # n=3,000 seed-7 pilot IDs come from the committed result blob; prompt-dev IDs
  # are also excluded. The runner must validate n, uniqueness, both hashes, and
  # zero final/exclusion overlap before loading any model.
  manifest_path: config/manifests/final_n1500_seed20260805.json
  manifest_file_sha256: 841dbca9ac7e76c0277a5696fba9f7e254b973afb0b670efbc5edfc006b4af46
  manifest_sha256: 5d4cc24872aeb603cbd005f790958199ef4cc993a1e7f048403608603da602af
  exclusion_sha256: a5cfacb84fa9a48217f3206a095706a6d48802bd244151c72f2eef08372c00a8
  preflight_manifest_path: config/manifests/preflight_excluded32.json
  preflight_manifest_file_sha256: bc517df47316867c2c8532f568a8d006e976603e517d4edc475b9a84df58a8db
  preflight_manifest_sha256: 089a12904a68ff69217bf5bad30456a0643d55913cb6651a941a4abe65909bc9

# SPEC §3 (revised). The distractor setting handed every stage both gold
# paragraphs, which left decomposition no mechanism through which to help and is
# why single_fp16 beat the four-agent pipeline by 9.2 EM. Passages are now
# retrieved from a pooled open-domain corpus.
#
# corpus_configs ORDER IS LOAD-BEARING: `distractor` must be first. 402 titles
# appear in both configs with different sentence splits, and supporting_facts
# sent_id is defined against the distractor context. Reversing these silently
# shifts gold sentence indices and corrupts every extraction-accuracy number.
#
# fullwiki contributes a real IR system's top-10 (hard lexical distractors, gold
# missing for 39% of questions); distractor guarantees gold stays reachable.
# Union: 72,094 passages, 100% gold-in-corpus.
#
# k and hop1 were swept on n=1500 before any GPU time: k in {5,8,10,12,16,20},
# hop1 in {5,6,7,8}. Gain plateaus above k=8; 7/3 keeps the full hidden-bridge
# gain (+0.160 all-gold) at roughly half the fully-named cost of a 5/5 split
# (-0.095 vs -0.172).
retrieval:
  corpus_configs: [distractor, fullwiki]
  k: 10
  hop1: 7

generation:
  # Scientific control, not an autotuning target. Preflight every configuration
  # at 32; a production OOM must fail the arm and the campaign, never halve it.
  batch_size: 32
  min_batch_size: 32
  log_confidence: false

results_dir: results

analysis:
  primary_metric: f1
  co_report_metrics: [em]
  noninferiority_margin_f1_points: 1.0
  paired_bootstrap_replicates: 10000
  primary_family: role_8bit_vs_small_fp16
  multiplicity_correction: holm
  secondary_families:
    - role_4bit
    - tiny_floor
    - mechanism

memory_accounting:
  unit: MiB
  primary_topology: concurrent_distinct_weights
  primary_metric: deduplicated_concurrent_model_footprint_mib
  co_report:
    - isolated_role_service_model_footprint_mib
    - sequential_peak_vram_allocated_mib
    - sequential_peak_vram_reserved_mib
    - stages.*.model_footprint_mib
    - stages.*.parameter_mib
    - stages.*.buffer_mib
  measured_reference_mib:
    base_3b_fp16: 5886.0
    base_3b_8bit: 3240.0
    base_3b_4bit: 1917.0
    small_1_5b_fp16: 2944.4
    tiny_0_5b_fp16: 942.3

timing:
  reference_run: baseline
  reference_ratio: 1.0
  primary_metric: steady_state_inverse_throughput_ratio
  benchmark_device_policy: one_reserved_uncontended_a100
  # Timing never reuses the final 1,500. It runs twice on a frozen excluded
  # 128-question cohort after a separate excluded batch-32 warm-up.
  manifest_path: config/manifests/timing_excluded128_seed20260805.json
  manifest_file_sha256: 44f0cdf0b1e729861f38e86537b7f5e77cb3adf8a58c75db60d9d38811ef29ca
  manifest_sha256: 3fce4065511c0959b86144179ff19144b85bea7dfb083495be695cd66c051de6
  n: 128
  seed: 20260805
  repetitions: 2
  fixed_batch_size: 32
  warmup: true
  cuda_synchronize: true
  randomize_run_order: true
  run_ids:
    - baseline
    - planner_8bit
    - stepdef_8bit
    - extractor_8bit
    - qa_8bit
    - planner_4bit
    - stepdef_4bit
    - extractor_4bit
    - qa_4bit
    - planner_small
    - stepdef_small
    - extractor_small
    - qa_small
    - ma_uniform_8bit
    - ma_uniform_4bit
    - ma_uniform_small
    - single_fp16
  post_selection_run_id: ma_optimized_exploratory
  excluded_runs:
    - planner_tiny
    - stepdef_tiny
    - extractor_tiny
    - qa_tiny
    - ma_uniform_tiny
  model_load_time: co_report_separately
  edge_latency_claim: false

# Post-ablation exploratory selector. It is not the Q-vs-S near-memory-match.
# It enumerates 4^4=256 complete allocations and charges each distinct resident
# configuration once. The 0.5B tier is deliberately excluded. The selector may
# return an existing uniform/reference run; otherwise it materializes one frozen
# `ma_optimized_exploratory` run in the committed artifact below.
allocation_selector:
  enabled: true
  status: pending_ablation_results
  exploratory: true
  noninferiority_margin_f1_points: 1.0
  roles: [planner, step_definer, extractor, qa]
  candidates:
    base_fp16: {model: base, precision: fp16}
    base_8bit: {model: base, precision: 8bit}
    base_4bit: {model: base, precision: 4bit}
    small_fp16: {model: small, precision: fp16}
  excluded_candidates:
    tiny_fp16: appendix_floor_only
  candidate_allocation_count: 256
  objective: minimize_deduplicated_concurrent_model_footprint_mib
  constraint:
    metric: f1
    comparison: paired_bootstrap_95pct_lower_bound_noninferior_to_baseline
    margin_points: 1.0
  tie_breakers:
    - higher_predicted_f1
    - fewer_distinct_configurations
    - lexical_allocation_id
  output_run_id: ma_optimized_exploratory
  output_artifacts:
    selection_trace: analysis/ma_optimized_exploratory.selection.json
    executable_config: analysis/ma_optimized_exploratory.experiment.yaml
  reuse_existing_run_when_identical: true

# Static matrix: 22 run IDs. The original 21 arms are retained, including all
# five 0.5B floor arms, and single_fp16 is added. The selector can add at most
# one distinct execution, for a campaign maximum of 23. If it selects an
# existing static allocation, the maximum actually executed remains 22.
runs:
  # Reference: uniform four-role multi-agent system, 3B FP16.
  baseline:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: fp16

  # Primary near-memory-matched quantization side: one 3B 8-bit role.
  planner_8bit:
    planner: 8bit
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_8bit:
    planner: fp16
    step_definer: 8bit
    extractor: fp16
    qa: fp16
  extractor_8bit:
    planner: fp16
    step_definer: fp16
    extractor: 8bit
    qa: fp16
  qa_8bit:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: 8bit

  # Separate aggressive-quantization tier; not interpreted as a clean 8-to-4
  # bit-width dose response because bitsandbytes uses different algorithms.
  planner_4bit:
    planner: 4bit
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_4bit:
    planner: fp16
    step_definer: 4bit
    extractor: fp16
    qa: fp16
  extractor_4bit:
    planner: fp16
    step_definer: fp16
    extractor: 4bit
    qa: fp16
  qa_4bit:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: 4bit

  # Primary near-memory-matched size side: one 1.5B FP16 role.
  planner_small:
    planner: {model: small, precision: fp16}
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_small:
    planner: fp16
    step_definer: {model: small, precision: fp16}
    extractor: fp16
    qa: fp16
  extractor_small:
    planner: fp16
    step_definer: fp16
    extractor: {model: small, precision: fp16}
    qa: fp16
  qa_small:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: {model: small, precision: fp16}

  # Prespecified uniform frontier controls.
  ma_uniform_8bit:
    planner: 8bit
    step_definer: 8bit
    extractor: 8bit
    qa: 8bit
  ma_uniform_4bit:
    planner: 4bit
    step_definer: 4bit
    extractor: 4bit
    qa: 4bit
  ma_uniform_small:
    planner: {model: small, precision: fp16}
    step_definer: {model: small, precision: fp16}
    extractor: {model: small, precision: fp16}
    qa: {model: small, precision: fp16}

  # Appendix-only 0.5B compliance/capacity floor. These five runs establish
  # where functional role behavior breaks down. They are excluded from the
  # selector, primary hypothesis family, and main-paper allocation claims.
  planner_tiny:
    planner: {model: tiny, precision: fp16}
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_tiny:
    planner: fp16
    step_definer: {model: tiny, precision: fp16}
    extractor: fp16
    qa: fp16
  extractor_tiny:
    planner: fp16
    step_definer: fp16
    extractor: {model: tiny, precision: fp16}
    qa: fp16
  qa_tiny:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: {model: tiny, precision: fp16}
  ma_uniform_tiny:
    planner: {model: tiny, precision: fp16}
    step_definer: {model: tiny, precision: fp16}
    extractor: {model: tiny, precision: fp16}
    qa: {model: tiny, precision: fp16}

  # Architecture control: one competitive direct-answer call over the same ten
  # provided paragraphs, using the same 3B FP16 model and answer budget.
  single_fp16:
    solo: fp16
