# Post-ablation exploratory selector. It is not the Q-vs-S near-memory-match.
# It declares 5^4=625 complete allocations and charges each distinct resident
# configuration once. A role may use 0.5B only when its one-role ablation clears
# the frozen strict-protocol lower-bound gate. The selector may
# return an existing uniform/reference run; otherwise it materializes one frozen
# `ma_optimized_exploratory` run in the committed artifact below.
allocation_selector:
  enabled: true
  status: pending_ablation_results
  exploratory: true
  noninferiority_margin_f1_points: 1.0
  roles: [planner, step_definer, extractor, qa]
  candidates:
    base_fp16: {model: base, precision: fp16}
    base_8bit: {model: base, precision: 8bit}
    base_4bit: {model: base, precision: 4bit}
    small_fp16: {model: small, precision: fp16}
    tiny_fp16: {model: tiny, precision: fp16}
  candidate_allocation_count: 625
  tiny_eligibility_gate:
    source: corresponding_one_role_tiny_ablation
    metric: strict_protocol_success
    resampling_unit: question
    question_clustered_95pct_lower_bound_min: 0.90
    ineligible_action: remove_tiny_for_that_role_only
    # Passing this only admits the role to enumeration. Every complete
    # allocation must separately clear the paired-F1 noninferiority bound below,
    # preventing a well-formatted but functionally useless tiny role from being
    # selected.
  objective: minimize_deduplicated_concurrent_model_footprint_mib
  constraint:
    metric: f1
    comparison: paired_bootstrap_95pct_lower_bound_noninferior_to_baseline
    margin_points: 1.0
  tie_breakers:
    - higher_predicted_f1
    - fewer_distinct_configurations
    - lexical_allocation_id
  output_run_id: ma_optimized_exploratory
  output_artifacts:
    selection_trace: analysis/ma_optimized_exploratory.selection.json
    executable_config: analysis/ma_optimized_exploratory.experiment.yaml
  reuse_existing_run_when_identical: true

# Static matrix: 22 run IDs. The original 21 arms are retained, including all
# five 0.5B floor arms, and single_fp16 is added. The selector can add at most
# one distinct execution, for a campaign maximum of 23. If it selects an
# existing static allocation, the maximum actually executed remains 22.
runs:
  # Reference: uniform four-role multi-agent system, 3B FP16.
  baseline:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: fp16

  # Primary near-memory-matched quantization side: one 3B 8-bit role.
  planner_8bit:
    planner: 8bit
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_8bit:
    planner: fp16
    step_definer: 8bit
    extractor: fp16
    qa: fp16
  extractor_8bit:
    planner: fp16
    step_definer: fp16
    extractor: 8bit
    qa: fp16
  qa_8bit:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: 8bit

  # Separate aggressive-quantization tier; not interpreted as a clean 8-to-4
  # bit-width dose response because bitsandbytes uses different algorithms.
  planner_4bit:
    planner: 4bit
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_4bit:
    planner: fp16
    step_definer: 4bit
    extractor: fp16
    qa: fp16
  extractor_4bit:
    planner: fp16
    step_definer: fp16
    extractor: 4bit
    qa: fp16
  qa_4bit:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: 4bit

  # Primary near-memory-matched size side: one 1.5B FP16 role.
  planner_small:
    planner: {model: small, precision: fp16}
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_small:
    planner: fp16
    step_definer: {model: small, precision: fp16}
    extractor: fp16
    qa: fp16
  extractor_small:
    planner: fp16
    step_definer: fp16
    extractor: {model: small, precision: fp16}
    qa: fp16
  qa_small:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: {model: small, precision: fp16}

  # Prespecified uniform frontier controls.
  ma_uniform_8bit:
    planner: 8bit
    step_definer: 8bit
    extractor: 8bit
    qa: 8bit
  ma_uniform_4bit:
    planner: 4bit
    step_definer: 4bit
    extractor: 4bit
    qa: 4bit
  ma_uniform_small:
    planner: {model: small, precision: fp16}
    step_definer: {model: small, precision: fp16}
    extractor: {model: small, precision: fp16}
    qa: {model: small, precision: fp16}

  # Appendix-first 0.5B compliance/capacity floor. These five runs establish
  # where functional role behavior breaks down. They are outside the primary
  # hypothesis family, but a role can enter the exploratory selector when its
  # question-clustered strict-protocol lower confidence bound clears 0.90.
  planner_tiny:
    planner: {model: tiny, precision: fp16}
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_tiny:
    planner: fp16
    step_definer: {model: tiny, precision: fp16}
    extractor: fp16
    qa: fp16
  extractor_tiny:
    planner: fp16
    step_definer: fp16
    extractor: {model: tiny, precision: fp16}
    qa: fp16
  qa_tiny:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: {model: tiny, precision: fp16}
  ma_uniform_tiny:
    planner: {model: tiny, precision: fp16}
    step_definer: {model: tiny, precision: fp16}
    extractor: {model: tiny, precision: fp16}
    qa: {model: tiny, precision: fp16}

  # Architecture control: one original-question BM25 top-10 retrieval followed
  # by one direct-answer call, using the same 3B FP16 model and answer budget.
  single_fp16:
    solo: fp16
