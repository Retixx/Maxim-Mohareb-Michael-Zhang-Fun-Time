# Experiment configuration. Everything is driven from here (SPEC §8).
#
#   python -m src.runner --config config/experiment.yaml --run stepdef_4bit

# The run's base model: what a stage gets when its treatment is a bare precision
# string. Overridable with --model-id. Model 2 is a config value, not a plugin
# (SPEC §12):  model_id: meta-llama/Llama-3.2-3B-Instruct
model_id: Qwen/Qwen2.5-1.5B-Instruct

# Aliases for the size axis (SPEC §2 Phase S, §8). `base` always resolves to
# model_id above, so it does not need an entry. Same family, same tokenizer, same
# instruct recipe as the base model — the closest available approximation to a
# pure parameter-count intervention (SPEC §12's stated limitation).
models:
  small: Qwen/Qwen2.5-0.5B-Instruct
  # Model 2's pair, for build step 17:
  #   base:  meta-llama/Llama-3.2-3B-Instruct   (via model_id)
  #   small: meta-llama/Llama-3.2-1B-Instruct

dataset:
  name: hotpot_qa
  config: distractor    # SPEC §3: 2 gold + 8 distractor paragraphs, no retriever
  split: validation
  # Raised from SPEC §5's 300 to 750 by human decision at Gate 2. Reason: the
  # n=300 tier returned a null with every CI spanning zero. Measured SE of the EM
  # drop was 2.21 pp, so ~720 questions are needed for 80% power against a true
  # 4 pp effect (~960 for 90%). For reference, MA-RAG evaluated on 5600 HotpotQA
  # dev questions — 18.7x our original n — which is most of why they could resolve
  # a four-way role ranking and we could not.
  #
  # RAISED TO 3000 for the A100 tier (SPEC §2 "Compute budget"). Sized to the
  # GPU actually available: Phase Q + Phase S at n=3000 is ~5.2 GPU-h on one
  # A100, i.e. about half a 10-hour window, leaving margin for downloads, a
  # smoke test, an OOM retry and one run that has to be redone. n=5000 would fit
  # the arithmetic and not the reality — a completed n=3000 tier beats a
  # truncated n=5000 one, and resume does not help if the instance disappears.
  #
  # SE of the EM drop goes 2.21 pp (n=750, measured) -> ~1.10 pp, i.e. ~80% power
  # against a 3 pp effect on a SINGLE test. Per SPEC §5f expect the primary
  # format-heavy vs knowledge-heavy contrast to resolve and most per-role numbers
  # not to. The n=750 tier is now PILOT data and must not be pooled with this one.
  n: 3000

  # Seed for sampling the n evaluation questions.
  #
  # Deliberately NOT 0 and NOT 1234. Prompt development looked at failures from
  # seed 0 (n=10) and seed 1234 (n=30); questions the prompts were shaped on must
  # not be questions the experiment is scored on. Seed 7 has never been inspected.
  # If you iterate on prompts again, do it on 0 or 1234 and leave this alone.
  eval_seed: 7

generation:
  # SPEC §6: start here, auto-reduce on OOM. 16 was a 4 GB-card number; on an
  # A100 use 64 (80 GB) or 32 (40 GB). MUST be identical across every run being
  # compared: greedy decoding is deterministic for a fixed batch but NOT across
  # re-batchings, so a run at a different batch size is not comparable to its
  # baseline. This is measured, not theoretical — 10/300 answers changed between
  # the n=300 and n=750 tiers from re-batching alone.
  batch_size: 64
  min_batch_size: 1

  # Log per-call answer confidence (mean/min token logprob, mean entropy) so the
  # CALIBRATION half of SPEC §1's mechanism claim can finally be tested — see the
  # pre-registered prediction 4 in SPEC §5b. Format damage has already been ruled
  # out on three instruments; calibration is the only part of §1 still live.
  #
  # Off by default. It costs roughly one extra prefill per batch, and turning it on
  # mid-project would make wall-time comparisons across runs meaningless. Turn it on
  # for the planned n=5000 rerun, where every run is generated from scratch anyway.
  log_confidence: true

results_dir: results

# SPEC §2, locked. Exactly one agent quantized per run; the rest stay FP16.
runs:
  baseline:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: fp16
  planner_4bit:
    planner: 4bit
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_4bit:
    planner: fp16
    step_definer: 4bit
    extractor: fp16
    qa: fp16
  extractor_4bit:
    planner: fp16
    step_definer: fp16
    extractor: 4bit
    qa: fp16
  qa_4bit:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: 4bit

  # --- SPEC §2 Phase S — size ablation. Same shape as Phase Q, other axis.
  # Shares the `baseline` run above; do NOT add a second baseline. The perturbed
  # role holds 942.2 MB at 0.5B/fp16 against 1070.2 MB at 1.5B/4-bit, so the size
  # arm runs on 13.6% FEWER bytes than the quantization arm — stated, not hidden
  # (SPEC §2). analyze.py must print that gap beside every Q-vs-S comparison.
  planner_small:
    planner: {model: small, precision: fp16}
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_small:
    planner: fp16
    step_definer: {model: small, precision: fp16}
    extractor: fp16
    qa: fp16
  extractor_small:
    planner: fp16
    step_definer: fp16
    extractor: {model: small, precision: fp16}
    qa: fp16
  qa_small:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: {model: small, precision: fp16}

  # --- SPEC §2 Phase D — uniform arms. These are fixed by definition, not
  # chosen from data, so defining them now does not pre-empt the §5e allocation
  # rule (which still must be committed here BEFORE the role-aware arms run).
  #
  # Note the deduped footprints (SPEC §5d): a uniform run needs ONE resident
  # instance, so ma_uniform_4bit sits at 1070.2 MB — below every single-role
  # quantized run in Phase Q, which each need two. Uniform allocation is
  # memory-efficient precisely because it is uniform. That is the frontier the
  # role-aware arms have to beat.
  ma_uniform_4bit:        # deduped 1070.2 MB
    planner: 4bit
    step_definer: 4bit
    extractor: 4bit
    qa: 4bit
  ma_uniform_small:       # deduped 942.2 MB
    planner: {model: small, precision: fp16}
    step_definer: {model: small, precision: fp16}
    extractor: {model: small, precision: fp16}
    qa: {model: small, precision: fp16}
