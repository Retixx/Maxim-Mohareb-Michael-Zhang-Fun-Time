# Authoritative configuration for the one-shot A100 experiment.
# See SPEC.md. Every accuracy arm uses the frozen 1,500-question manifest once.
#
# Model family: Qwen3 (April 2025). Unified base weights with thinking/
# non-thinking mode; no separate -Instruct variant. All generation uses
# non-thinking mode (enable_thinking=False) for deterministic structured output.

model_id: Qwen/Qwen3-8B

models:
  large: Qwen/Qwen3-14B
  mid: Qwen/Qwen3-4B
  small: Qwen/Qwen3-1.7B
  tiny: Qwen/Qwen3-0.6B

# Resolve model and tokenizer files at these immutable Hugging Face revisions.
# The runner must record the resolved revision in every run metadata file.
# TODO: pin exact commit SHAs before campaign launch.
model_revisions:
  Qwen/Qwen3-14B: TBD
  Qwen/Qwen3-8B: TBD
  Qwen/Qwen3-4B: TBD
  Qwen/Qwen3-1.7B: TBD
  Qwen/Qwen3-0.6B: TBD

# Qwen3 non-thinking mode. The runner must pass enable_thinking=False (or the
# equivalent chat-template flag) to every generation call. Thinking tokens would
# consume the frozen token ceilings and confound the capacity-allocation signal.
thinking_mode: false

dataset:
  name: hotpotqa/hotpot_qa
  config: distractor
  split: validation
  revision: 1908d6afbbead072334abe2965f91bd2709910ab
  n: 1500
  eval_seed: 20260805
  retrieval_strata_counts:
    hidden_bridge: 1097
    fully_named: 403

  # This file, rather than a fresh random draw, is authoritative. It contains
  # exactly 1,500 ordered IDs and the exact 3,031-ID exclusion union. The old
  # n=3,000 seed-7 pilot IDs come from the committed result blob; prompt-dev IDs
  # are also excluded. The runner must validate n, uniqueness, both hashes, and
  # zero final/exclusion overlap before loading any model.
  manifest_path: config/manifests/final_n1500_seed20260805.json
  manifest_file_sha256: ba2836fdcd180a16daae625c09ae6bc4f68aee26a072e9bbef14e44ec6868f90
  manifest_sha256: 5d4cc24872aeb603cbd005f790958199ef4cc993a1e7f048403608603da602af
  exclusion_sha256: a5cfacb84fa9a48217f3206a095706a6d48802bd244151c72f2eef08372c00a8
  preflight_manifest_path: config/manifests/preflight_excluded32.json
  preflight_manifest_file_sha256: 76bddb6719560dd052b8b2f38244a6ff3b8b3e21a58e0619ebe9ec1358950c23
  preflight_manifest_sha256: 089a12904a68ff69217bf5bad30456a0643d55913cb6651a941a4abe65909bc9

# SPEC §3 (revised). The distractor setting handed every stage both gold
# paragraphs, which left decomposition no mechanism through which to help.
# Passages are now retrieved from a pooled open-domain corpus.
#
# corpus_configs ORDER IS LOAD-BEARING: `distractor` must be first. 402 titles
# appear in both configs with different sentence splits, and supporting_facts
# sent_id is defined against the distractor context. Reversing these silently
# shifts gold sentence indices and corrupts every extraction-accuracy number.
#
# fullwiki contributes a real IR system's top-10 (hard lexical distractors, gold
# missing for 39% of questions); distractor guarantees gold stays reachable.
# Union: 72,094 passages, 100% gold-in-corpus.
#
# Step 1 uses the original-question top-10. Every later QA step searches both
# the original question and an original-question-anchored Step Definer task;
# fusion exposes seven anchor passages and up to three unique task passages.
# Literal answer grounding is telemetry, not a follow-up fire/no-fire gate.
retrieval:
  corpus_configs: [distractor, fullwiki]
  expected_corpus_passages: 72094
  expected_corpus_sha256: 931425de7b123e3081ed63387c8d591a8aba4cf872d2cf47144e924260d92b73
  required_gold_title_coverage: 1.0
  required_gold_sentence_coverage: 1.0
  algorithm: sparse_bm25_lucene_idf_v1
  query_policy: original_question_anchor_7_plus_anchored_step_task_3_v2
  k: 10
  initial_query_source: original_question
  grounded_followup_k: 10
  anchor_k: 7
  task_k: 3
  grounded_followup_requires_evidence: false

architecture:
  framework: ma-rag
  conceptual_agents: [planner, step_definer, extractor, qa]
  max_plan_steps: 5
  plan_step_routing: [question-answering, aggregate]
  extractor_granularity: per_document
  semantic_stop_on_qa_success_no: true
  finalizer: step_definer_plan_summary

generation:
  # Scientific control, not an autotuning target. Preflight every configuration
  # at 32; a production OOM must fail the arm and the campaign, never halve it.
  batch_size: 32
  min_batch_size: 32
  log_confidence: false

results_dir: results

analysis:
  primary_metric: f1
  co_report_metrics: [em]
  noninferiority_margin_f1_points: 1.0
  paired_bootstrap_replicates: 10000
  # Primary family: 8B 8-bit (~8.5 GiB) vs 4B FP16 (~8 GiB), near-memory-matched.
  primary_family: role_8bit_vs_mid_fp16
  multiplicity_correction: holm
  secondary_families:
    - role_4bit
    - role_small
    - role_tiny_floor
    - role_large
    - mechanism

memory_accounting:
  unit: MiB
  primary_topology: concurrent_distinct_weights
  primary_metric: deduplicated_concurrent_model_footprint_mib
  co_report:
    - isolated_role_service_model_footprint_mib
    - sequential_peak_vram_allocated_mib
    - sequential_peak_vram_reserved_mib
    - stages.*.model_footprint_mib
    - stages.*.parameter_mib
    - stages.*.buffer_mib
  # Estimated from parameter counts. Must be re-measured on the A100 before the
  # campaign and updated here. Qwen3 actual footprints may differ from estimates.
  measured_reference_mib:
    large_14b_fp16: 28000.0
    base_8b_fp16: 16000.0
    base_8b_8bit: 8500.0
    base_8b_4bit: 5000.0
    mid_4b_fp16: 8000.0
    small_1_7b_fp16: 3400.0
    tiny_0_6b_fp16: 1200.0

pilot:
  required_before_final_campaign: true
  manifest_path: config/manifests/pilot_excluded200_seed20260806.json
  manifest_file_sha256: 975210805c382788bb39c800266ae22a88cc526e0626bd8a0106c35d316a8bb1
  manifest_sha256: f8c3f16458340cb0bc74aa827e3b51528ba351963a46dba456ac4e68ad20f7d7
  n: 200
  seed: 20260806
  retrieval_strata_counts: {hidden_bridge: 160, fully_named: 40}
  run_ids: [baseline, single_fp16]
  gate_artifact: analysis/pilot_gate.json
  decision:
    primary_metric: f1
    paired_bootstrap_resamples: 10000
    paired_bootstrap_seed: 20260807
    pass_if_multiagent_minus_single_overall_at_least: 5.0
    pass_if_paired_bootstrap_95pct_lower_bound_above: 2.0
    pass_if_mcnemar_exact_two_sided_p_below: 0.01
    pass_if_multiagent_minus_single_hidden_bridge_at_least: 8.0
    pass_if_absolute_multiagent_minus_single_fully_named_at_most: 2.0
    pass_if_hidden_bridge_followup_firing_rate_at_least: 0.80
    failure_action: stop_before_final_accuracy_or_timing

timing:
  reference_run: baseline
  reference_ratio: 1.0
  primary_metric: steady_state_inverse_throughput_ratio
  benchmark_device_policy: one_reserved_uncontended_a100
  # Timing never reuses the final 1,500. It runs twice on a frozen excluded
  # 128-question cohort after a separate excluded batch-32 warm-up.
  manifest_path: config/manifests/timing_excluded128_seed20260805.json
  manifest_file_sha256: 200f131692aa73c5a0b9ed6fb0fe43e0154b40884f3cbb08f3900983232c5f40
  manifest_sha256: 3fce4065511c0959b86144179ff19144b85bea7dfb083495be695cd66c051de6
  n: 128
  seed: 20260805
  repetitions: 2
  fixed_batch_size: 32
  warmup: true
  cuda_synchronize: true
  randomize_run_order: true
  run_ids:
    - baseline
    - planner_8bit
    - stepdef_8bit
    - extractor_8bit
    - qa_8bit
    - planner_4bit
    - stepdef_4bit
    - extractor_4bit
    - qa_4bit
    - planner_mid
    - stepdef_mid
    - extractor_mid
    - qa_mid
    - planner_small
    - stepdef_small
    - extractor_small
    - qa_small
    - planner_large
    - stepdef_large
    - extractor_large
    - qa_large
    - ma_uniform_8bit
    - ma_uniform_4bit
    - ma_uniform_mid
    - ma_uniform_small
    - ma_uniform_large
    - single_fp16
  post_selection_run_id: ma_optimized_exploratory
  excluded_runs:
    - planner_tiny
    - stepdef_tiny
    - extractor_tiny
    - qa_tiny
    - ma_uniform_tiny
  model_load_time: co_report_separately
  edge_latency_claim: false

# Post-ablation exploratory selector. It declares 7^4=2401 complete allocations
# and charges each distinct resident configuration once. A role may use 0.6B
# only when its one-role ablation clears the frozen strict-protocol lower-bound
# gate. The selector may return an existing uniform/reference run; otherwise it
# materializes one frozen `ma_optimized_exploratory` run.
allocation_selector:
  enabled: true
  status: pending_ablation_results
  exploratory: true
  noninferiority_margin_f1_points: 1.0
  roles: [planner, step_definer, extractor, qa]
  candidates:
    large_fp16: {model: large, precision: fp16}
    base_fp16: {model: base, precision: fp16}
    base_8bit: {model: base, precision: 8bit}
    base_4bit: {model: base, precision: 4bit}
    mid_fp16: {model: mid, precision: fp16}
    small_fp16: {model: small, precision: fp16}
    tiny_fp16: {model: tiny, precision: fp16}
  candidate_allocation_count: 2401
  tiny_eligibility_gate:
    source: corresponding_one_role_tiny_ablation
    metric: strict_protocol_success
    resampling_unit: question
    question_clustered_95pct_lower_bound_min: 0.90
    ineligible_action: remove_tiny_for_that_role_only
  objective: minimize_deduplicated_concurrent_model_footprint_mib
  constraint:
    metric: f1
    comparison: paired_bootstrap_95pct_lower_bound_noninferior_to_baseline
    margin_points: 1.0
  tie_breakers:
    - higher_predicted_f1
    - fewer_distinct_configurations
    - lexical_allocation_id
  output_run_id: ma_optimized_exploratory
  output_artifacts:
    selection_trace: analysis/ma_optimized_exploratory.selection.json
    executable_config: analysis/ma_optimized_exploratory.experiment.yaml
  reuse_existing_run_when_identical: true

# Static matrix: 32 run IDs. The selector can add at most one distinct
# execution, for a campaign maximum of 33. If it selects an existing static
# allocation, the maximum actually executed remains 32.
runs:
  # Reference: uniform four-role 8B FP16.
  baseline:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: fp16

  # Primary near-memory-matched quantization side: one 8B 8-bit role.
  planner_8bit:
    planner: 8bit
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_8bit:
    planner: fp16
    step_definer: 8bit
    extractor: fp16
    qa: fp16
  extractor_8bit:
    planner: fp16
    step_definer: fp16
    extractor: 8bit
    qa: fp16
  qa_8bit:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: 8bit

  # Aggressive-quantization tier; not interpreted as a clean 8-to-4 bit-width
  # dose response because bitsandbytes uses different algorithms.
  planner_4bit:
    planner: 4bit
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_4bit:
    planner: fp16
    step_definer: 4bit
    extractor: fp16
    qa: fp16
  extractor_4bit:
    planner: fp16
    step_definer: fp16
    extractor: 4bit
    qa: fp16
  qa_4bit:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: 4bit

  # Primary near-memory-matched size side: one 4B FP16 role.
  # 4B FP16 (~8 GiB) is near-memory-matched to 8B 8-bit (~8.5 GiB).
  planner_mid:
    planner: {model: mid, precision: fp16}
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_mid:
    planner: fp16
    step_definer: {model: mid, precision: fp16}
    extractor: fp16
    qa: fp16
  extractor_mid:
    planner: fp16
    step_definer: fp16
    extractor: {model: mid, precision: fp16}
    qa: fp16
  qa_mid:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: {model: mid, precision: fp16}

  # Secondary size tier: one 1.7B FP16 role.
  planner_small:
    planner: {model: small, precision: fp16}
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_small:
    planner: fp16
    step_definer: {model: small, precision: fp16}
    extractor: fp16
    qa: fp16
  extractor_small:
    planner: fp16
    step_definer: fp16
    extractor: {model: small, precision: fp16}
    qa: fp16
  qa_small:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: {model: small, precision: fp16}

  # 0.6B compliance/capacity floor. These five runs establish where functional
  # role behavior breaks down. They are outside the primary hypothesis family,
  # but a role can enter the exploratory selector when its question-clustered
  # strict-protocol lower confidence bound clears 0.90.
  planner_tiny:
    planner: {model: tiny, precision: fp16}
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_tiny:
    planner: fp16
    step_definer: {model: tiny, precision: fp16}
    extractor: fp16
    qa: fp16
  extractor_tiny:
    planner: fp16
    step_definer: fp16
    extractor: {model: tiny, precision: fp16}
    qa: fp16
  qa_tiny:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: {model: tiny, precision: fp16}

  # Upward capacity ablation: one 14B FP16 role. Measures the marginal value
  # of additional capacity per role.
  planner_large:
    planner: {model: large, precision: fp16}
    step_definer: fp16
    extractor: fp16
    qa: fp16
  stepdef_large:
    planner: fp16
    step_definer: {model: large, precision: fp16}
    extractor: fp16
    qa: fp16
  extractor_large:
    planner: fp16
    step_definer: fp16
    extractor: {model: large, precision: fp16}
    qa: fp16
  qa_large:
    planner: fp16
    step_definer: fp16
    extractor: fp16
    qa: {model: large, precision: fp16}

  # Uniform controls.
  ma_uniform_8bit:
    planner: 8bit
    step_definer: 8bit
    extractor: 8bit
    qa: 8bit
  ma_uniform_4bit:
    planner: 4bit
    step_definer: 4bit
    extractor: 4bit
    qa: 4bit
  ma_uniform_mid:
    planner: {model: mid, precision: fp16}
    step_definer: {model: mid, precision: fp16}
    extractor: {model: mid, precision: fp16}
    qa: {model: mid, precision: fp16}
  ma_uniform_small:
    planner: {model: small, precision: fp16}
    step_definer: {model: small, precision: fp16}
    extractor: {model: small, precision: fp16}
    qa: {model: small, precision: fp16}
  ma_uniform_tiny:
    planner: {model: tiny, precision: fp16}
    step_definer: {model: tiny, precision: fp16}
    extractor: {model: tiny, precision: fp16}
    qa: {model: tiny, precision: fp16}
  ma_uniform_large:
    planner: {model: large, precision: fp16}
    step_definer: {model: large, precision: fp16}
    extractor: {model: large, precision: fp16}
    qa: {model: large, precision: fp16}

  # Architecture control: one original-question BM25 top-10 retrieval followed
  # by one direct-answer call, using the same 8B FP16 model and answer budget.
  single_fp16:
    solo: fp16
