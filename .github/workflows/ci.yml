name: CI

# The expensive failure mode for this repo is not a crash — it is silent
# contract drift that burns A100 hours (SPEC §14 BUG-9). So CI runs the unit
# tests AND the integrity healthcheck on every push.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"          # dict/set ordering must not decide a result
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the campaign runtime. 3.12 guards against a runtime bump
        # breaking us later; the repo needs >=3.10 for `X | None` annotations.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the test suite never touches a GPU, and the CUDA
          # wheel is ~2.5 GB of download for nothing.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pyyaml numpy scipy transformers datasets

      - name: Run test suite
        run: python -m pytest tests/ -q --junitxml=junit-${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}
          path: junit-${{ matrix.python-version }}.xml

  healthcheck:
    name: repo integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pyyaml numpy scipy

      # Every launch-blocking invariant: arm contract, manifest hash pins,
      # cohort disjointness, model revision pins, retrieval policy agreement,
      # frozen plan coverage, line endings.
      - name: Health check
        run: python scripts/healthcheck.py

  regression-guards:
    name: multi-hop regression guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pyyaml numpy scipy

      # Called out as its own job so a regression in SPEC §14 BUG-1/2/3 is
      # legible on the PR page rather than buried in a 140-test summary.
      - name: Retrieval defect guards
        run: |
          python -m pytest \
            tests/test_retrieval.py::MultiHopRegressionGuards -v

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      # Errors only. This is a research repo mid-campaign; a style sweep would
      # produce a diff nobody can review against a frozen experiment.
      - name: Ruff (correctness rules)
        run: ruff check --output-format=github .

      - name: Compile all sources
        run: python -m compileall -q src scripts tests analyze.py smoke_test.py
